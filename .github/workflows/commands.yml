name: Telegram Commands

# Polls Telegram for your commands (/rank, /scan, /sector, /help) and replies.
# Runs every 5 minutes during market-relevant hours. GitHub's minimum cron
# granularity is ~5 minutes, so expect up to a few minutes' delay after you type.
on:
  schedule:
    - cron: "*/5 6-22 * * 1-5"
  workflow_dispatch:

jobs:
  commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Handle commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_commands.py
