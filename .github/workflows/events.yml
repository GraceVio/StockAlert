name: Event Digest

# Sends the earnings + macro (CPI/FOMC/GDP/PCE/Jobs) digest to Telegram each
# weekday morning, and can be run manually any time.
on:
  schedule:
    # Off-peak minute (NOT :00 — GitHub drops/delays top-of-hour runs the most,
    # which is why the digest was arriving ~11:00 instead of ~08:00). Single
    # cron only: this job SENDS messages, so firing it twice would double-send
    # the digest. 06:12 UTC ≈ 08:12 CET summer / 07:12 CET winter, Mon-Fri.
    - cron: "12 6 * * 1-5"
  workflow_dispatch:

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send event digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python events.py
