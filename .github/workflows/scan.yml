name: Stock Alert Scan

# Runs every 15 minutes during US + European market hours (UTC), weekdays.
# Xetra ~06:00-14:30 UTC (summer) · NYSE ~13:30-20:00 UTC (summer).
on:
  schedule:
    - cron: "*/15 6-20 * * 1-5"
  workflow_dispatch:   # lets you run it manually from the Actions tab to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
